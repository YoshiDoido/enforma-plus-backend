version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: Diadema_Enforma_MySQL
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: diademaEnforma
      MYSQL_USER: admin
      MYSQL_PASSWORD: enforma
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: