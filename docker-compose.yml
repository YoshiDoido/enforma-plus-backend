version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: Diadema_Enforma_MySQL
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: diademaEnforma
      MYSQL_USER: admin
      MYSQL_PASSWORD: enforma
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: Diadema_Enforma_RabbitMQ
    ports:
      - 15672:15672
      - 5672:5672
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

volumes:
  mysql_data: